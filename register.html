{% extends "layout.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1>Create your account</h1>
        <p class="auth-subtitle">Start tracking the market in minutes.</p>
        <form action="{{ url_for('register') }}" method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="new-password" required minlength="6">

            <label for="confirmation">Confirm Password</label>
            <input type="password" id="confirmation" name="confirmation" autocomplete="new-password" required minlength="6">

            <button type="submit" class="btn-primary">Create Account</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Log In</a></p>
    </div>
</div>
{% endblock %}
